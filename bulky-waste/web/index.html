<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대형폐기물 수수료 안내</title>
<meta name="description" content="버릴 물건 이름을 적으면 우리 동네 대형폐기물 수수료를 바로 알려 드립니다.">
<meta name="theme-color" content="#0f6b5c">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" aria-label="처음으로">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>우리동네플러스</span>
    </a>
    <button type="button" class="muni-pill" id="muniPill" hidden aria-label="지자체 바꾸기"><span id="muniName"></span><small>변경</small></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>대형폐기물 수수료 안내</h1>
    <p>버릴 물건 이름을 적으면 수수료를 바로 알려 드립니다.</p>
  </section>

  <form id="where" class="panel ask" autocomplete="off" hidden>
    <label for="place" class="lbl">거주하고 계신 지자체명을 입력해 주세요</label>
    <div class="field">
      <input id="place" type="text" maxlength="20" enterkeyhint="search" placeholder="예: 과천시, 수원, 강남구"
             role="combobox" aria-autocomplete="list" aria-controls="placeList" aria-expanded="false">
    </div>
    <ul id="placeList" class="places" role="listbox" aria-label="지자체 목록"></ul>
    <p id="placeMsg" class="hint"></p>
  </form>

  <form id="ask" class="panel ask" autocomplete="off" hidden>
    <label for="item" class="lbl">품목 이름</label>
    <div class="field">
      <input id="item" name="item" type="text" inputmode="text" enterkeyhint="done" maxlength="40"
             placeholder="예: 식기세척기, 캣타워" aria-describedby="hint">
      <button type="button" id="add" class="btn ghost" aria-label="품목 추가">추가</button>
    </div>
    <p id="hint" class="hint">여러 개는 쉼표(,)로 나누거나 하나씩 추가하세요.</p>
    <ul id="chips" class="chips" aria-label="추가한 품목"></ul>
    <div class="quick" aria-label="자주 찾는 품목">
      <span class="quick-t">자주 찾는 품목</span>
      <div class="quick-list" id="quick"></div>
    </div>
    <button type="submit" id="go" class="btn primary block">수수료 확인</button>
  </form>

  <section id="out" class="out" aria-live="polite" hidden>
    <div id="result" class="panel result" hidden>
      <p class="lead" id="lead"></p>
      <div id="rows"></div>
      <div class="actions" id="actions">
        <button type="button" class="btn small" data-copy="text">결과 복사</button>
        <button type="button" class="btn small" data-copy="table">표 복사</button>
        <button type="button" class="btn small" data-dl="csv">CSV</button>
        <button type="button" class="btn small" data-dl="xlsx">엑셀</button>
      </div>
    </div>
    <div id="cards"></div>
    <div id="pending" class="panel pending" hidden></div>
  </section>

  <section id="ticketview" class="panel" hidden></section>
</main>

<footer class="foot wrap">
  <p id="footnote">표시된 금액은 선택한 지자체의 대형폐기물 배출 수수료입니다.</p>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js" defer></script>
</body>
</html>

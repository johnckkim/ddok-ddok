<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>대형폐기물 수수료 안내</title>
<meta name="description" content="품목을 입력하면 AI가 우리 동네 대형폐기물 수수료를 알려드립니다.">
<meta name="theme-color" content="#00c4b4">
<link rel="icon" href="/static/udong.png" type="image/png">
<link rel="apple-touch-icon" href="/static/udong-512.png">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="chat-page">
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" aria-label="처음으로">
      <span>우리동네플러스 <small>수수료 안내</small></span>
    </a>
    <button type="button" class="muni-pill" id="muniPill" hidden aria-label="지자체 바꾸기"><span id="muniName"></span><small>변경</small></button>
  </div>
</header>

<main class="chat" id="chat">
  <div class="wrap thread" id="thread" role="log" aria-live="polite" aria-label="대화">
    <section class="intro" id="intro">
      <img src="/static/udong.png" alt="" width="52" height="52">
      <h1>대형폐기물 수수료 안내</h1>
      <p>품목을 입력하면 AI가 수수료를 알려드립니다</p>
    </section>
  </div>
</main>

<footer class="composer">
  <div class="wrap">
    <ul class="suggest" id="suggest" role="listbox" aria-label="추천"></ul>
    <form id="composer" class="box" autocomplete="off">
      <label for="input" class="sr" id="inputLabel">메시지</label>
      <input id="input" type="text" maxlength="200" enterkeyhint="send" placeholder="거주하고 계신 지자체명 (예: 과천시)">
      <button type="submit" id="send" class="send" aria-label="보내기">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5m0 0l-6 6m6-6l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="fine" id="footnote">여러 품목은 쉼표(,)로 구분해 주세요.</p>
  </div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=4" defer></script>
</body>
</html>
